[package]
name = "quectel-webui"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "macros"] }
sha2 = "0.11.0"
hex = "0.4.3"
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
futures = "0.3.34"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
async-trait = "0.1.92"
hmac = "0.13.0"
base64 = "0.23.1"
anyhow = "1.0.104"

# 纯 Rust TLS 服务端（禁用默认 provider，切断 aws-lc-rs/ring C 依赖）
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "0.0.2-alpha"
# 纯 Rust 内存证书生成（仅 p256 特性，零 C 代码）
certkit = { version = "0.2.0", default-features = false, features = ["p256"] }
rust-embed = "8.12.0"
mime_guess = "2.0.5"
